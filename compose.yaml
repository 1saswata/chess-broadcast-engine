services:
  RabbitMQ:
    image: rabbitmq:4.2-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  Redis:
    image: redis:8.6-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  Jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger 
    ports:
      - "16686:16686"
      - "4318:4318"

  Postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Updated to use env variables so the healthcheck doesn't fail if credentials change
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ingest-node:
    build: 
      dockerfile: Dockerfile.server
    container_name: ingest
    environment:
      AMQP_SERVER_URL: ${AMQP_SERVER_URL}
      REDIS_URL: ${REDIS_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      DB_URL: ${DB_URL}
    ports:
      - "50051:50051"
      - "8080:8080"
    depends_on:
      RabbitMQ:
        condition: service_healthy
      Redis:
        condition: service_healthy
      Postgres:
        condition: service_healthy

  broadcast-node:
    build: 
      dockerfile: Dockerfile.broadcaster
    container_name: broadcaster
    environment: 
      AMQP_SERVER_URL: ${AMQP_SERVER_URL}
      REDIS_URL: ${REDIS_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    ports:
      - "8081:8081"
    depends_on:
      RabbitMQ:
        condition: service_healthy
      Redis:
        condition: service_healthy
      Postgres:
        condition: service_healthy

volumes:
  pgdata: